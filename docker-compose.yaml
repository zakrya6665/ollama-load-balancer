services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    # Use Ollama's normal entrypoint.
    # Start the server first; pull the model after it is ready.
    command:
      - serve
    networks:
      - HexaSynq
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  hexabiz-gateway:
    build:
      context: ./hexabiz-gateway  # <--- CHANGED: Points to the root directory where your Dockerfile and package.json are located
    restart: always
    networks:
      - HexaSynq
    ports:
      - "3000:3000"
    environment:
      # Core Configuration
      PORT: 3000
      OLLAMA_DEFAULT_MODEL: "synq:latest"
      OLLAMA_RUNNERS: "http://ollama:11434"

      # Evolution API Integration
      EVOLUTION_SERVER_URL: "http://whatsapp_api:8080"
      EVOLUTION_GLOBAL_KEY: "${EVOLUTION_GLOBAL_KEY}" # Coolify will inject this from your Environment Variables

      # App Security
      APP_ENROLLMENT_KEY: "${APP_ENROLLMENT_KEY}" # Coolify will inject this

      # AI Provider & Fallback Configuration
      AI_PROVIDER: "ollama"
      FALLBACK_MODEL: "openai/gpt-5.4-nano"
      POLLINATIONS_BASE_URL: "https://gen.pollinations.ai"
      POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY}"

      # Rate Limiting & Security Tuning
      MAX_QUEUE_SIZE: 50
      RATE_LIMIT_WINDOW_MS: 60000
      MAX_REQUESTS_PER_WINDOW: 20
      HMAC_MAX_SKEW_SECONDS: 60
      OUTBOUND_TIMEOUT_MS: 120000
      MAX_PROMPT_LENGTH: 12000

    depends_on:
      ollama:
        condition: service_healthy
          
networks:
  HexaSynq:
    external: true
    name: HexaSynq
volumes:
  ollama-data:

