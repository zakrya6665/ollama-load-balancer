services:
  ollama:
    image: ollama/ollama:latest
    restart: always
    volumes:
      - ollama-data:/root/.ollama
    command:
      - serve
    networks:
      - HexaSynq
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  hexabiz-gateway:
    build:
      context: ./hexabiz-gateway
    restart: always
    networks:
      - HexaSynq
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      INSTANCE_CREATE_LIMIT: "${INSTANCE_CREATE_LIMIT}"
      OLLAMA_DEFAULT_MODEL: "synq:latest"
      OLLAMA_RUNNERS: "http://ollama:11434"
      EVOLUTION_SERVER_URL: "http://whatsapp_api:8080"
      EVOLUTION_GLOBAL_KEY: "${EVOLUTION_GLOBAL_KEY}"
      APP_ENROLLMENT_KEY: "${APP_ENROLLMENT_KEY}"
      AI_PROVIDER: "ollama"
      FALLBACK_MODEL: "openai/gpt-5.4-nano"
      POLLINATIONS_BASE_URL: "https://gen.pollinations.ai"
      POLLINATIONS_API_KEY: "${POLLINATIONS_API_KEY}"
      MAX_QUEUE_SIZE: 50
      RATE_LIMIT_WINDOW_MS: 60000
      MAX_REQUESTS_PER_WINDOW: 20
      HMAC_MAX_SKEW_SECONDS: 60
      OUTBOUND_TIMEOUT_MS: 120000
      MAX_PROMPT_LENGTH: 12000
      FIREBASE_SERVICE_ACCOUNT_PATH: "/data/serviceAccountKey.json"
    volumes:
      - ./gateway_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s      
networks:
  HexaSynq:
    external: true
    name: HexaSynq
volumes:
  ollama-data:
